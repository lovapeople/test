name: SharkNinja weekly snapshot

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Optional: rebuild the month up to this Sunday, e.g. 2026-08-30 for August (leave blank for this month)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pull this month from Salesforce and build the dashboard
        env:
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}
        run: python build.py
      - uses: actions/configure-pages@v5
        id: pages
      - name: Only publish when the data has changed
        id: check
        run: |
          live=$(curl -fsS "${{ steps.pages.outputs.base_url }}/version.json?t=$(date +%s)" \
                 | python -c "import json,sys; print(json.load(sys.stdin)['version'])" || true)
          new=$(python -c "import json; print(json.load(open('site/version.json'))['version'])")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$live" = "$new" ]; then
            echo "No change since the last publish ($new)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
