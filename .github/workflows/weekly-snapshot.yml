name: SharkNinja weekly snapshot

on:
  schedule:
    - cron: "*/30 * * * *"   # backup only; watch-salesforce.yml checks every minute and starts this workflow on changes
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Optional: rebuild the month up to this Sunday, e.g. 2026-08-30 for August (leave blank for this month)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pull from Salesforce and build both dashboards
        env:
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}
        run: |
          python build.py
          python build_all.py
      - uses: actions/configure-pages@v5
        id: pages
      - name: Only publish when the data has changed
        id: check
        run: |
          version() { python -c "import json,sys; print(json.load(sys.stdin)['version'])" 2>/dev/null; }
          live=""
          for p in version.json all/version.json; do
            live="$live$(curl -fsS "${{ steps.pages.outputs.base_url }}/$p?t=$(date +%s)" 2>/dev/null | version || true)/"
          done
          new="$(version < site/version.json)/$(version < site/all/version.json)/"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$live" = "$new" ]; then
            echo "No change since the last publish ($new)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
